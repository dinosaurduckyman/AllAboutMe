<script>
(() => {
  let audioContext = null;
  let masterGain = null;
  let playing = false;
  let noteIndex = 0;

  const melody = [
    { note: "E4", duration: 0.55 }, { note: "D4", duration: 0.55 }, { note: "C4", duration: 0.55 }, { note: "D4", duration: 0.55 },
    { note: "E4", duration: 0.55 }, { note: "E4", duration: 0.55 }, { note: "E4", duration: 1.1 },
    { note: "D4", duration: 0.55 }, { note: "D4", duration: 0.55 }, { note: "D4", duration: 1.1 },
    { note: "E4", duration: 0.55 }, { note: "G4", duration: 0.55 }, { note: "G4", duration: 1.1 },
    { note: "E4", duration: 0.55 }, { note: "D4", duration: 0.55 }, { note: "C4", duration: 0.55 }, { note: "D4", duration: 0.55 },
    { note: "E4", duration: 0.55 }, { note: "E4", duration: 0.55 }, { note: "E4", duration: 1.1 },
    { note: "D4", duration: 0.55 }, { note: "D4", duration: 0.55 }, { note: "E4", duration: 0.55 }, { note: "D4", duration: 0.55 },
    { note: "C4", duration: 1.5 }
  ];

  const frequencies = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88 };

  function createAudio() {
    if (audioContext) return;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.10;
    masterGain.connect(audioContext.destination);
  }

  function playNote(note, duration) {
    if (!audioContext || !playing) return;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.value = frequencies[note];
    const now = audioContext.currentTime;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.08);
    gain.gain.setValueAtTime(0.12, now + duration - 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    oscillator.connect(gain);
    gain.connect(masterGain);
    oscillator.start(now);
    oscillator.stop(now + duration);

    setTimeout(playNextNote, duration * 1000);
  }

  function playNextNote() {
    if (!playing) return;
    const current = melody[noteIndex];
    playNote(current.note, current.duration);
    noteIndex++;
    if (noteIndex >= melody.length) { noteIndex = 0; }
  }

  async function startMusic() {
    createAudio();
    if (audioContext.state === "suspended") { await audioContext.resume(); }
    if (playing) return;
    playing = true;
    noteIndex = 0;
    playNextNote();
  }

  window.addEventListener("load", () => { 
    startMusic(); 
    setupLightbox();
  });

  const startAfterInteraction = () => { if (playing) return; startMusic(); };

  document.addEventListener("click", startAfterInteraction, { once: true });
  document.addEventListener("touchstart", startAfterInteraction, { once: true });
  document.addEventListener("keydown", startAfterInteraction, { once: true });

 
  function setupLightbox() {
    const galleryItems = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const closeBtn = document.querySelector('.lightbox-close');

    galleryItems.forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightboxCaption.textContent = img.alt;
        
  
        if (img.classList.contains('rotated')) {
          lightboxImg.classList.add('rotated');
        } else {
          lightboxImg.classList.remove('rotated');
        }

        lightbox.classList.add('active');
        lightbox.setAttribute('aria-hidden', 'false');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeLightbox();
      }
    });
  }
})();
</script>
